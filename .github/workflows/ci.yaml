name: Build Docker Image
permissions: {}
on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run pre-commit hook
        uses: j178/prek-action@v3.1.1

  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GHA
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Check GHA lock
        run: gh actions-lock --verify

  build:
    runs-on: ubuntu-latest
    needs: [lint, lockfile]
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker metadata
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/testdotcom/opencode-msb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/bake-action@v7.5.0
        env:
          OPENCODE_VERSION: ${{ steps.meta.outputs.version }}
        with:
          push: true
          source: "{{defaultContext}}"
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: build
